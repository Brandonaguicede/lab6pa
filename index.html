<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNA Chat</title>
  <meta name="description" content="Chat privado de la comunidad UNA.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --blue: #1455d9;
      --blue-dark: #102f67;
      --ink: #17324f;
      --muted: #4e6480;
      --line: #d7e5f4;
      --page: #e8f1ff;
      --surface: #fff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font: 16px 'Outfit', system-ui, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: .9rem max(1.25rem, calc((100vw - 960px) / 2));
      color: white;
      background: linear-gradient(112deg, #102f59, #1d5cae);
      box-shadow: 0 8px 24px #00000014;
      border-radius: 0 0 1.25rem 1.25rem;
    }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -.025em; }
    .user { display: flex; align-items: center; gap: .75rem; font-weight: 500; }
    .user img { width: 38px; height: 38px; border-radius: 13px; object-fit: cover; border: 2px solid #ffffffa8; }
    .user a {
      padding: .48rem .82rem;
      border: 1px solid #ffffff40;
      border-radius: .7rem;
      background: #ffffff12;
      text-decoration: none;
      transition: background-color .18s ease, transform .18s ease;
    }
    .user a:hover { background: #ffffff25; transform: translateY(-1px); }
    a { color: inherit; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #82b8ff; outline-offset: 3px; }
    main { width: min(960px, 100%); margin: auto; padding: 1.5rem 1.25rem 7rem; }
    #status { min-height: 1.5rem; margin: 0 0 .4rem; color: #a53d4b; font-weight: 500; }
    #messages { list-style: none; padding: 0; margin: 1.15rem 0 0; }
    #messages:empty::before {
      content: "Todavía no hay mensajes. Inicia la conversación.";
      display: block;
      padding: 2.2rem 1rem;
      color: var(--muted);
      text-align: center;
      background: #ffffff9c;
      border: 1px dashed #c4d7ed;
      border-radius: 1.15rem;
    }
    #messages li {
      width: fit-content;
      max-width: min(82%, 720px);
      margin: .7rem 0;
      padding: .8rem 1rem;
      overflow-wrap: anywhere;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1rem 1rem 1rem .3rem;
      box-shadow: 0 5px 16px #183e6810;
    }
    #messages li b { color: var(--blue-dark) !important; font-weight: 600; }
    #messages img, #messages video, #messages iframe { max-width: 100%; border-radius: .75rem; }
    form {
      position: fixed;
      z-index: 1;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: center;
      gap: .65rem;
      padding: .85rem max(1rem, calc((100vw - 960px) / 2));
      background: #f9fcffed;
      border-top: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    form input {
      width: min(720px, 75vw);
      min-width: 0;
      padding: .82rem 1rem;
      color: var(--ink);
      background: white;
      border: 1px solid #c9d9eb;
      border-radius: .85rem;
      font: inherit;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    form input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px #2563c71a; }
    form button {
      padding: .8rem 1.35rem;
      color: white;
      background: var(--blue);
      border: 0;
      border-radius: .85rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 14px #1c56a52e;
      transition: background-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    form button:hover:not(:disabled) { background: #1b53a8; transform: translateY(-1px); box-shadow: 0 8px 18px #1c56a53b; }
    form button:active:not(:disabled) { transform: translateY(1px); }
    form button:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
    @media (max-width: 520px) {
      header { align-items: flex-start; }
      .user { gap: .5rem; flex-wrap: wrap; justify-content: flex-end; font-size: .9rem; }
      .user img { width: 32px; height: 32px; }
      .user a { padding: .4rem .6rem; }
      main { padding-inline: 1rem; }
      #messages li { max-width: 94%; }
      form { padding-inline: .75rem; }
      form button { padding-inline: 1rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
    ::selection { background: #bcd4ff; color: #102f67; }
    html { scrollbar-color: #7c9bc8 #e8f1ff; }
    input { caret-color: var(--blue); }
    input::placeholder { color: #526784; opacity: 1; }    body { background: var(--page); }
    header { background: #102f67; border-radius: 0; }
    #messages:empty::before { background: #f8fbff; border-color: #8aa7d1; }
    #messages li { box-shadow: none; }
    form { background: #f8fbff; backdrop-filter: none; }
    .conversation-heading { margin: 1rem 0 .4rem; font-size: 1.6rem; letter-spacing: -.025em; color: var(--blue-dark); }
    .conversation-description { margin: 0 0 1.8rem; color: var(--muted); line-height: 1.5; }
    @media (max-width: 520px) {
      header h1 { flex-shrink: 0; }
      #identity { max-width: 40vw; overflow-wrap: anywhere; }
      form { padding-bottom: max(.85rem, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <header>
    <h1>UNA Chat</h1>
    <div class="user"><img id="picture" alt="" hidden><span id="identity">Cargando...</span><a href="/logout">Cerrar sesión</a></div>
  </header>
  <main>
    <h2 class="conversation-heading">La conversación empieza aquí</h2>
    <p class="conversation-description">Comparte un mensaje con la comunidad UNA.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="messages" aria-label="Mensajes"></ul>
  </main>
  <form id="form">
    <input id="message" autocomplete="off" placeholder="Escriba un mensaje" aria-label="Mensaje" required>
    <button id="send" type="submit" disabled>Enviar</button>
  </form>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
  <script>
    const status = document.getElementById('status');
    const send = document.getElementById('send');
    const message = document.getElementById('message');
    fetch('/api/me').then(response => {
      if (response.status === 401) { location.href = '/?login_required=1'; return null; }
      if (!response.ok) throw new Error('No se pudo cargar la identidad.');
      return response.json();
    }).then(user => {
      if (!user) return;
      document.getElementById('identity').textContent = user.name || user.email || 'Usuario';
      if (user.picture && /^https:\/\//.test(user.picture)) {
        const picture = document.getElementById('picture');
        picture.src = user.picture;
        picture.hidden = false;
      }
    }).catch(() => { status.textContent = 'No se pudo cargar la identidad. Actualice la página para reintentar.'; });
    function show(raw) {
      const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
      const item = document.createElement('li');
      item.innerHTML = `<b style="color:${data.color}">${data.nombre}</b>: ${data.mensaje}`;
      document.getElementById('messages').append(item);
      window.scrollTo(0, document.body.scrollHeight);
    }
    const connectionError = () => { send.disabled = true; status.textContent = 'No se pudo conectar al chat. Actualice la página para reintentar.'; };
    let transmit = null;
    function useSocketIo() {
      const socket = io({ reconnectionAttempts: 3 });
      socket.on('connect', () => { status.textContent = ''; send.disabled = false; });
      socket.on('disconnect', () => { status.textContent = 'Se perdió la conexión. Intentando reconectar...'; send.disabled = true; });
      socket.on('connect_error', error => {
        send.disabled = true;
        status.textContent = error.message.includes('iniciar sesión') ? 'La sesión terminó. Inicie sesión de nuevo.' : 'No se pudo conectar al chat. Actualice la página para reintentar.';
      });
      socket.on('Evento-Mensaje-Server', show);
      transmit = text => { if (socket.connected) socket.emit('Evento-Mensaje-Server', JSON.stringify({ mensaje: text, color: '#1455d9' })); };
    }
    function usePusher(config) {
      const pusher = new Pusher(config.key, { cluster: config.cluster, channelAuthorization: { endpoint: '/api/pusher/auth' } });
      pusher.connection.bind('connected', () => { status.textContent = ''; });
      pusher.connection.bind('error', connectionError);
      const channel = pusher.subscribe(config.channel);
      channel.bind('pusher:subscription_succeeded', () => { status.textContent = ''; send.disabled = false; });
      channel.bind('pusher:subscription_error', connectionError);
      channel.bind(config.event, show);
      transmit = text => fetch('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje: text, color: '#1455d9' }) }).then(response => {
          if (response.status === 401) location.href = '/?login_required=1';
          else if (!response.ok) status.textContent = 'No se pudo enviar el mensaje. Intente de nuevo.';
        }).catch(() => { status.textContent = 'No se pudo enviar el mensaje. Intente de nuevo.'; });
    }
    fetch('/api/config').then(response => response.ok ? response.json() : Promise.reject())
      .then(config => config.transport === 'pusher' ? usePusher(config) : useSocketIo())
      .catch(connectionError);
    document.getElementById('form').addEventListener('submit', event => {
      event.preventDefault();
      const text = message.value.trim();
      if (!text || !transmit || send.disabled) return;
      transmit(text);
      message.value = '';
    });
  </script>
</body>
</html>
